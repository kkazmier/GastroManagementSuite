<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>GastroManagementSuite</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/alpinejs" defer></script>
    <style>
        body {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .welcome-box {
            background-color: white;
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .welcome-box h1 {
            margin-bottom: 30px;
            font-weight: bold;
            font-size: 1.8rem;
            color: #343a40;
        }

        .welcome-box .btn {
            width: 100%;
            margin: 10px 0;
        }
    </style>
</head>
<body>
<div class="welcome-box">
    <h1>Witaj w<br>GastroManagementSuite</h1>
    <a href="login.html" class="btn btn-primary">Zaloguj się</a>
    <a href="register.html" class="btn btn-outline-secondary">Zarejestruj</a>
</div>
</body>
</html>
