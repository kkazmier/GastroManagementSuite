<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Mapa Dostaw | GastroManagementSuite</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    #map {
      flex: 1;
      width: 100%;
    }

    .navbar-brand {
      font-weight: bold;
    }
  </style>
</head>
<body>

<!-- Pasek nawigacyjny -->
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">GastroManagementSuite</a>
    <button class="btn btn-outline-light" onclick="location.href='dashboard.html'">← Powrót do Panelu</button>
  </div>
</nav>

<!-- Mapa -->
<div id="map"></div>

<script>
  const map = L.map('map').setView([52.2297, 21.0122], 6); // Domyślnie Polska

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap',
    maxZoom: 18,
  }).addTo(map);

  async function loadDeliveries() {
    const res = await fetch('/api/deliveries', {
      headers: {
        'Authorization': 'Bearer ' + localStorage.getItem('jwt')
      }
    });

    if (!res.ok) {
      alert('Błąd ładowania dostaw');
      return;
    }

    const deliveries = await res.json();

    deliveries.forEach(delivery => {
      const addr = delivery.address;
      if (addr && addr.latitude && addr.longitude) {
        const marker = L.marker([addr.latitude, addr.longitude]).addTo(map);
        marker.bindPopup(`
          <div>
            <strong>Dostawa #${delivery.id}</strong><br>
            ${addr.street}<br>
            ${addr.postalCode} ${addr.city}<br>
            ${addr.country}<br><br>
            <a href="delivery-details.html?id=${delivery.id}" class="btn btn-sm btn-primary">Szczegóły</a>
          </div>
        `);
      }
    });
  }

  loadDeliveries();
</script>

</body>
</html>
