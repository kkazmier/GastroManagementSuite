<!-- static/employees.html -->
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Pracownicy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid justify-content-between">
    <span class="navbar-text text-white" id="userNameLabel">Witaj, użytkowniku</span>
    <div>
      <button class="btn btn-outline-light me-2" onclick="location.href='dashboard.html'">Panel</button>
      <button class="btn btn-outline-light" onclick="logout()">Wyloguj</button>
    </div>
  </div>
</nav>

<div class="container mt-5">
  <h1>Lista Pracowników</h1>
  <!-- Tutaj dynamicznie lista pracowników -->
</div>

<script>
  async function loadUserData() {
    const token = localStorage.getItem('jwt');
    if (!token) {
      window.location.href = '/login.html';
      return;
    }

    try {
      const res = await fetch('/api/users/me', {
        headers: {
          'Authorization': 'Bearer ' + token
        }
      });

      if (!res.ok) throw new Error('Brak dostępu');

      const user = await res.json();
      document.getElementById('userNameLabel').textContent = 'Witaj, ' + user.fullName;
    } catch (e) {
      logout();
    }
  }

  function logout() {
    localStorage.removeItem('jwt');
    window.location.href = '/login.html';
  }

  document.addEventListener('DOMContentLoaded', loadUserData);
</script>
</body>
</html>
