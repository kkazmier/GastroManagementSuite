<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Rejestracja</title>
</head>
<body>
<h2>Rejestracja</h2>
<form id="registerForm">
  <input type="text" name="username" placeholder="Nazwa użytkownika" required><br>
  <input type="email" name="email" placeholder="Email" required><br>
  <input type="text" name="fullName" placeholder="Imię i nazwisko" required><br>
  <input type="password" name="password" placeholder="Hasło" required><br>
  <button type="submit">Zarejestruj</button>
  <p id="errorMsg" style="color:red;"></p>
</form>

<script>
  document.getElementById('registerForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const form = e.target;
    const payload = {
      username: form.username.value,
      email: form.email.value,
      fullName: form.fullName.value,
      password: form.password.value
    };

    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const errText = await res.text();
        document.getElementById('errorMsg').textContent = errText || 'Błąd rejestracji';
      } else {
        window.location.href = '/login.html?registered';
      }
    } catch (err) {
      document.getElementById('errorMsg').textContent = 'Błąd połączenia z serwerem';
    }
  });
</script>
</body>
</html>
