<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Rejestracja | GastroManagementSuite</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #f8f9fa, #e9ecef);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .register-box {
      background-color: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 100%;
    }

    .register-box h2 {
      text-align: center;
      margin-bottom: 25px;
      font-weight: bold;
      color: #343a40;
    }

    .form-control {
      margin-bottom: 15px;
    }

    #errorMsg {
      color: red;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="register-box">
  <h2>Rejestracja</h2>
  <form id="registerForm">
    <input type="text" name="username" placeholder="Nazwa użytkownika" class="form-control" required>
    <input type="email" name="email" placeholder="Email" class="form-control" required>
    <input type="text" name="fullName" placeholder="Imię i nazwisko" class="form-control" required>
    <input type="password" name="password" placeholder="Hasło" class="form-control" required>
    <button type="submit" class="btn btn-primary w-100">Zarejestruj</button>
    <p id="errorMsg"></p>
  </form>
</div>

<script>
  document.getElementById('registerForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const form = e.target;
    const payload = {
      username: form.username.value,
      email: form.email.value,
      fullName: form.fullName.value,
      password: form.password.value
    };

    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const errText = await res.text();
        document.getElementById('errorMsg').textContent = errText || 'Błąd rejestracji';
      } else {
        window.location.href = '/login.html?registered';
      }
    } catch (err) {
      document.getElementById('errorMsg').textContent = 'Błąd połączenia z serwerem';
    }
  });
</script>

</body>
</html>
