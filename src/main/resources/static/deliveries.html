<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Dostawy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

<div class="container">
    <h2 class="mb-4">Lista Dostaw</h2>
    <a href="new_delivery.html" class="btn btn-success mb-3">Utwórz nową dostawę</a>
    <a href="dashboard.html" class="btn btn-secondary mb-3">Powrót do panelu</a>

    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Ulica</th>
            <th>Miasto</th>
            <th>Kod pocztowy</th>
            <th>Kraj</th>
        </tr>
        </thead>
        <tbody id="deliveryTableBody">
        <!-- Dynamiczne dane -->
        </tbody>
    </table>
</div>

<script>
    async function loadDeliveries() {
        const token = localStorage.getItem('jwt');
        if (!token) {
            window.location.href = '/login.html';
            return;
        }

        try {
            const res = await fetch('/api/deliveries', {
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });

            if (!res.ok) throw new Error('Błąd pobierania dostaw');

            const deliveries = await res.json();
            const tbody = document.getElementById('deliveryTableBody');
            tbody.innerHTML = '';

            deliveries.forEach(delivery => {
                const row = document.createElement('tr');
                const address = delivery.address || {};

                row.innerHTML = `
                    <td>${delivery.id}</td>
                    <td>${address.street || '-'}</td>
                    <td>${address.city || '-'}</td>
                    <td>${address.postalCode || '-'}</td>
                    <td>${address.country || '-'}</td>
                `;

                tbody.appendChild(row);
            });
        } catch (e) {
            alert('Nie udało się załadować dostaw');
        }
    }

    document.addEventListener('DOMContentLoaded', loadDeliveries);
</script>

</body>
</html>
