<!-- static/new_delivery.html -->
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Nowa Dostawa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
<div class="container">
    <h2 class="mb-4">Utwórz Nową Dostawę</h2>
    <form id="deliveryForm">
        <div class="mb-3">
            <label class="form-label">Ulica</label>
            <input type="text" class="form-control" name="street" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Miasto</label>
            <input type="text" class="form-control" name="city" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Kod pocztowy</label>
            <input type="text" class="form-control" name="postalCode" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Kraj</label>
            <input type="text" class="form-control" name="country" value="Polska" required>
        </div>

        <button type="submit" class="btn btn-success">Zapisz dostawę</button>
        <a href="deliveries.html" class="btn btn-secondary">Anuluj</a>
    </form>
</div>

<script>
    document.getElementById('deliveryForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const formData = new FormData(e.target);

        const address = {
            street: formData.get('street'),
            city: formData.get('city'),
            postalCode: formData.get('postalCode'),
            country: formData.get('country')
        };

        // TODO: wywołanie LocationIQ API i wysłanie do backendu
        // lub delegowanie lokalizacji na backend

        const res = await fetch('/api/deliveries', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + localStorage.getItem('jwt')
            },
            body: JSON.stringify(address)
        });

        if (res.ok) {
            window.location.href = 'deliveries.html';
        } else {
            alert('Błąd przy tworzeniu dostawy');
        }
    });
</script>
</body>
</html>
