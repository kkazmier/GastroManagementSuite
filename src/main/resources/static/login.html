<!-- static/login.html -->
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Logowanie</title>
</head>
<body>
<h2>Logowanie</h2>
<form id="loginForm">
    <input type="text" name="username" placeholder="Nazwa użytkownika" required><br>
    <input type="password" name="password" placeholder="Hasło" required><br>
    <button type="submit">Zaloguj</button>
    <p id="errorMsg" style="color:red;"></p>
</form>

<p><a href="index.html">← Powrót do strony głównej</a></p>


<script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const form = e.target;
        const payload = {
            username: form.username.value,
            password: form.password.value
        };

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            if (!res.ok) {
                const err = await res.json();
                document.getElementById('errorMsg').textContent = err.message || 'Błąd logowania';
            } else {
                const data = await res.json();
                localStorage.setItem('jwt', data.token);
                window.location.href = '/dashboard.html';
            }
        } catch (err) {
            document.getElementById('errorMsg').textContent = 'Błąd połączenia z serwerem';
        }
    });
</script>
</body>
</html>
