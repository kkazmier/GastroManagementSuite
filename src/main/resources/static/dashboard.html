<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Panel Główny | GastroManagementSuite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 70px;
            background-color: #f8f9fa;
            font-family: 'Segoe UI', sans-serif;
        }

        .btn-lg {
            min-width: 200px;
            margin: 10px;
        }

        .section-title {
            font-weight: 600;
            margin-top: 40px;
            margin-bottom: 20px;
            color: #495057;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 1.4rem;
        }

        .dropdown-toggle::after {
            margin-left: 0.5rem;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">GastroManagementSuite</a>
        <div class="dropdown ms-auto">
            <button class="btn btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <span id="userNameLabel">Witaj, użytkowniku</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="#" onclick="logout()">Wyloguj</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main content -->
<div class="container text-center">
    <!-- Sekcja: Zarządzanie -->
    <h4 class="section-title">Zarządzanie</h4>
    <div class="d-flex flex-wrap justify-content-center">
<!--        <button class="btn btn-primary btn-lg" onclick="location.href='employees.html'">Pracownicy</button>-->
        <button class="btn btn-dark btn-lg" onclick="location.href='menu.html'">Menu</button>
<!--        <button class="btn btn-secondary btn-lg" onclick="location.href='reports.html'">Raporty</button>-->
    </div>

    <!-- Sekcja: Obsługa klienta -->
    <h4 class="section-title">Obsługa klienta</h4>
    <div class="d-flex flex-wrap justify-content-center">
        <button class="btn btn-success btn-lg" onclick="location.href='orders.html'">Zamówienia</button>
        <button class="btn btn-warning btn-lg" onclick="location.href='deliveries.html'">Dostawy</button>
        <button class="btn btn-info btn-lg" onclick="location.href='map.html'">Mapa</button>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    async function loadUserData() {
        const token = localStorage.getItem('jwt');
        if (!token) {
            window.location.href = '/login.html';
            return;
        }

        try {
            const res = await fetch('/api/users/me', {
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });

            if (!res.ok) throw new Error('Brak dostępu');

            const user = await res.json();
            document.getElementById('userNameLabel').textContent = 'Witaj, ' + user.fullName;
        } catch (e) {
            logout();
        }
    }

    function logout() {
        localStorage.removeItem('jwt');
        window.location.href = '/login.html';
    }

    document.addEventListener('DOMContentLoaded', loadUserData);
</script>

</body>
</html>
