<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Panel Główny</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 60px;
            background-color: #f8f9fa;
        }
        .btn-lg {
            min-width: 180px;
            margin: 10px;
        }
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
        }
    </style>
</head>
<body>
<!-- Pasek górny -->
<nav class="navbar navbar-dark bg-dark top-bar">
    <div class="container-fluid justify-content-between">
        <span class="navbar-text text-white" id="userNameLabel">Witaj, użytkowniku</span>
        <button class="btn btn-outline-light" onclick="logout()">Wyloguj</button>
    </div>
</nav>

<!-- Panel przycisków -->
<div class="container text-center mt-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10">
            <button class="btn btn-primary btn-lg" onclick="location.href='employees.html'">Pracownicy</button>
            <button class="btn btn-secondary btn-lg" onclick="location.href='reports.html'">Raporty</button>
            <button class="btn btn-success btn-lg" onclick="location.href='orders.html'">Zamówienia</button>
            <button class="btn btn-warning btn-lg" onclick="location.href='deliveries.html'">Dostawy</button>
            <button class="btn btn-info btn-lg" onclick="location.href='map.html'">Mapa</button>
        </div>
    </div>
</div>

<!-- Bootstrap & JS -->
<script>
    async function loadUserData() {
        const token = localStorage.getItem('jwt');
        if (!token) {
            window.location.href = '/login.html';
            return;
        }

        try {
            console.log('JWT:', token);
            console.log('Fetching user with token:', token);

            const res = await fetch('/api/users/me', {
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });

            if (!res.ok) throw new Error('Brak dostępu');

            const user = await res.json();
            document.getElementById('userNameLabel').textContent = 'Witaj, ' + user.fullName;
        } catch (e) {
            console.error('Błąd użytkownika:', e);
            logout(); // Token może być nieprawidłowy
        }
    }

    function logout() {
        localStorage.removeItem('jwt');
        window.location.href = '/login.html';
    }

    // Uruchom po załadowaniu strony
    document.addEventListener('DOMContentLoaded', loadUserData);
</script>
</body>
</html>
