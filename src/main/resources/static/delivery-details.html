<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Szczegóły dostawy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
<div class="container">
  <h2>Szczegóły dostawy</h2>
  <div id="deliveryDetails"></div>
  <a href="map.html" class="btn btn-secondary mt-3">Powrót do mapy</a>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  fetch('/api/deliveries', {
    headers: {
      'Authorization': 'Bearer ' + localStorage.getItem('jwt')
    }
  })
          .then(res => res.json())
          .then(data => {
            const delivery = data.find(d => d.id == id);
            const addr = delivery.address;
            document.getElementById('deliveryDetails').innerHTML = `
                <p><strong>ID:</strong> ${delivery.id}</p>
                <p><strong>Adres:</strong><br>
                ${addr.street}, ${addr.postalCode} ${addr.city}, ${addr.country}</p>
                <p><strong>Współrzędne:</strong> ${addr.latitude}, ${addr.longitude}</p>
            `;
          });
</script>
</body>
</html>
